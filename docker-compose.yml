version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kontor_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"
    networks:
      - kontor_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kontor_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kontor_network

networks:
  kontor_network:
    driver: bridge
